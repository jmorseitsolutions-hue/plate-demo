name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: GitHub moves "ubuntu-latest" to Ubuntu 26 from 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Unzip newest app code
        run: |
          zipfile=""
          for f in $(git log --diff-filter=AMR --format= --name-only -- 'src*.zip'); do
            if [ -f "$f" ]; then zipfile="$f"; break; fi
          done
          if [ -z "$zipfile" ]; then zipfile=$(ls src*.zip 2>/dev/null | sort | tail -1); fi
          if [ -z "$zipfile" ]; then echo "No src zip uploaded yet"; exit 1; fi
          echo "Using $zipfile"
          echo "### Built from: \`$zipfile\`" >> "$GITHUB_STEP_SUMMARY"
          rm -rf unzipped plate_demo && mkdir -p unzipped
          unzip -o "$zipfile" -d unzipped
          pub=$(find unzipped -name pubspec.yaml | head -1)
          mv "$(dirname "$pub")" plate_demo

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: plate_demo
        timeout-minutes: 15
        run: bash ci/prepare.sh

      - name: 1 - Code check
        working-directory: plate_demo
        timeout-minutes: 10
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test integration_test

      - name: 2 - Logic tests
        working-directory: plate_demo
        timeout-minutes: 10
        run: flutter test test/

      - name: 3 - Build release APK
        working-directory: plate_demo
        timeout-minutes: 25
        run: flutter build apk --release

      - name: Enable emulator speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 4 - Test on Android phone emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          disable-animations: true
          working-directory: plate_demo
          script: bash ci/run_device_tests.sh

      - name: 5 - Publish APK (only if no test failed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: PlateAlert Tested ${{ github.run_number }}${{ env.DEVICE_TEST == 'skipped' && ' (phone test skipped)' || '' }}
          files: plate_demo/build/app/outputs/flutter-apk/app-release.apk
